<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FreeAIBot">
  <!--
    Tanda merek FreeAIBot.
    Konsep: enam batang bertumpuk = enam tingkat penyedia dalam rantai cadangan.
    Batang teratas penuh (penyedia utama), sisanya makin pudar ke bawah (cadangan),
    sesuai cara kerja bot. Satu warna aksen, tanpa gradien dan tanpa efek glow.
  -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="#0a84ff"/>
  <g fill="#ffffff">
    <rect x="15" y="14" width="34" height="5.4" rx="2.7" opacity="1"/>
    <rect x="15" y="22.4" width="34" height="5.4" rx="2.7" opacity="0.78"/>
    <rect x="15" y="30.8" width="34" height="5.4" rx="2.7" opacity="0.58"/>
    <rect x="15" y="39.2" width="34" height="5.4" rx="2.7" opacity="0.40"/>
    <rect x="15" y="47.6" width="34" height="5.4" rx="2.7" opacity="0.24"/>
  </g>
</svg>
