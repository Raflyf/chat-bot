<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeAIBot Status</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #09090b;
      color: #fafafa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 2rem 2.5rem;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #10b981;
      font-weight: 600;
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
      background: rgba(16, 185, 129, 0.1);
      padding: 4px 12px;
      border-radius: 9999px;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
      font-weight: 700;
    }
    p {
      color: #a1a1aa;
      font-size: 0.95rem;
      margin: 0;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status"><span class="dot"></span> Online 24/7</div>
    <h1>FreeAIBot Backend</h1>
    <p>Telegram Webhook & Cloud Services active on Vercel Serverless.</p>
  </div>
</body>
</html>
