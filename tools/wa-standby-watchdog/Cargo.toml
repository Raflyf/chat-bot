[package]
name = "baileys-backup"
version = "1.0.0"
edition = "2021"
build = "build.rs"
description = "Baileys Backup - Lightweight Windows System Tray Standby & Auto-Failover for WhatsApp Baileys"

[[bin]]
name = "BaileysBackup"
path = "src/main.rs"

[dependencies]
windows = { version = "=0.58.0", default-features = false, features = [
    "std",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
