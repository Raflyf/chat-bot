[package]
name = "baileys-backup"
version = "1.0.0"
edition = "2021"
build = "build.rs"
description = "Baileys Backup - Lightweight Windows System Tray Standby & Auto-Failover for WhatsApp Baileys"

[[bin]]
name = "BaileysBackup"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
