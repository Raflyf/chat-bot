name: Build Baileys Backup (Windows)

on:
  push:
    branches: [main]
    paths:
      - 'tools/wa-standby-watchdog/**'
      - '.github/workflows/build-baileys-backup.yml'
    tags:
      - 'baileys-backup-v*'
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'tools/wa-standby-watchdog/**'
      - '.github/workflows/build-baileys-backup.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag GitHub Release opsional (kosong = baileys-backup-latest)'
        required: false
        default: ''
        type: string

concurrency:
  group: build-baileys-backup-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build, Test & MSI Setup (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies & target artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/wa-standby-watchdog

      - name: Run Rust unit tests
        shell: pwsh
        run: cargo test --locked --manifest-path tools/wa-standby-watchdog/Cargo.toml

      - name: Build release BaileysBackup.exe
        shell: pwsh
        run: cargo build --release --locked --manifest-path tools/wa-standby-watchdog/Cargo.toml

      - name: Verify embedded VersionInfo, manifest, and multi-res icons
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'tools\wa-standby-watchdog\target\release\BaileysBackup.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Release binary tidak ditemukan: $exe"
          }

          $vi = (Get-Item -LiteralPath $exe).VersionInfo
          $sizeKb = [Math]::Round((Get-Item -LiteralPath $exe).Length / 1024.0, 1)
          Write-Host "Binary: $exe ($sizeKb KB)"
          Write-Host "FileDescription=$($vi.FileDescription) | ProductName=$($vi.ProductName) | FileVersion=$($vi.FileVersion)"
          if ($vi.FileDescription -ne 'Baileys Backup') { throw "FileDescription tidak sesuai: '$($vi.FileDescription)'" }
          if ($vi.ProductName -ne 'Baileys Backup') { throw "ProductName tidak sesuai: '$($vi.ProductName)'" }

          Add-Type -ReferencedAssemblies System.Drawing -TypeDefinition @'
          using System;
          using System.Drawing;
          using System.Runtime.InteropServices;

          public static class ExeResourceVerifier {
              [DllImport("user32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              static extern uint PrivateExtractIconsW(string path, int idx, int cx, int cy, IntPtr[] phicon, uint[] piconid, uint nIcons, uint flags);
              [DllImport("user32.dll", SetLastError = true)]
              static extern bool DestroyIcon(IntPtr hIcon);
              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              static extern IntPtr LoadLibraryExW(string path, IntPtr hFile, uint flags);
              [DllImport("kernel32.dll", SetLastError = true)]
              static extern IntPtr FindResourceW(IntPtr hMod, IntPtr lpName, IntPtr lpType);
              [DllImport("kernel32.dll", SetLastError = true)]
              static extern uint SizeofResource(IntPtr hMod, IntPtr hResInfo);
              [DllImport("kernel32.dll", SetLastError = true)]
              static extern bool FreeLibrary(IntPtr hMod);

              public static void Verify(string exePath) {
                  IntPtr hMod = LoadLibraryExW(exePath, IntPtr.Zero, 0x00000002);
                  if (hMod == IntPtr.Zero) throw new Exception("LoadLibraryExW gagal: " + Marshal.GetLastWin32Error());
                  try {
                      IntPtr hManifest = FindResourceW(hMod, new IntPtr(1), new IntPtr(24));
                      if (hManifest == IntPtr.Zero) throw new Exception("RT_MANIFEST (24, ID=1) tidak ditemukan");
                      uint manifestBytes = SizeofResource(hMod, hManifest);
                      if (manifestBytes == 0) throw new Exception("RT_MANIFEST berukuran 0 byte");
                      Console.WriteLine("RT_MANIFEST bytes=" + manifestBytes);
                  } finally {
                      FreeLibrary(hMod);
                  }

                  foreach (int size in new[] { 16, 20, 24, 32, 48, 256 }) {
                      IntPtr[] icons = new IntPtr[1];
                      uint[] ids = new uint[1];
                      uint count = PrivateExtractIconsW(exePath, 0, size, size, icons, ids, 1, 0);
                      if (count < 1 || icons[0] == IntPtr.Zero) {
                          throw new Exception("Gagal mengekstrak ikon ukuran " + size + "px");
                      }
                      int nonZeroAlpha = 0;
                      using (Icon ic = Icon.FromHandle(icons[0]))
                      using (Bitmap bmp = ic.ToBitmap()) {
                          for (int y = 0; y < bmp.Height; y++) {
                              for (int x = 0; x < bmp.Width; x++) {
                                  if (bmp.GetPixel(x, y).A > 0) nonZeroAlpha++;
                              }
                          }
                      }
                      DestroyIcon(icons[0]);
                      Console.WriteLine(string.Format("Icon {0}x{0}: extracted={1}, nonZeroAlphaPixels={2}", size, count, nonZeroAlpha));
                      if (nonZeroAlpha == 0) {
                          throw new Exception("Ikon ukuran " + size + "px kosong (alpha 0)");
                      }
                  }
              }
          }
          '@

          [ExeResourceVerifier]::Verify($exe)

      - name: Setup .NET SDK for WiX
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build Windows MSI Setup (WiX v5)
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool update --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $tools = Join-Path $env:USERPROFILE '.dotnet\tools'
          $env:PATH = "$tools;$env:PATH"

          wix extension add --global WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wix extension add --global WixToolset.Util.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $cargoToml = Join-Path $PWD 'tools\wa-standby-watchdog\Cargo.toml'
          $version = (Select-String -LiteralPath $cargoToml -Pattern '^version\s*=\s*"([^"]+)"$' | Select-Object -First 1).Matches.Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Versi tidak ditemukan di Cargo.toml" }

          $outDir = Join-Path $PWD 'release-out'
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          $exe = Join-Path $PWD 'tools\wa-standby-watchdog\target\release\BaileysBackup.exe'
          $appIco = Join-Path $PWD 'bin\baileys-backup.ico'
          $activeIco = Join-Path $PWD 'bin\baileys-backup-active.ico'
          $licenseRtf = Join-Path $PWD 'tools\wa-standby-watchdog\assets\license.rtf'
          $licenseTxt = Join-Path $PWD 'LICENSE'
          $msiName = "BaileysBackup-setup-v$version.msi"
          $msiOut = Join-Path $outDir $msiName

          & wix build 'tools\wa-standby-watchdog\setup.wxs' `
            -arch x64 `
            -ext WixToolset.UI.wixext `
            -ext WixToolset.Util.wixext `
            -d "Version=$version" `
            -d "AppExe=$exe" `
            -d "AppIco=$appIco" `
            -d "ActiveIco=$activeIco" `
            -d "LicenseRtf=$licenseRtf" `
            -d "LicenseTxt=$licenseTxt" `
            -out "$msiOut"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Copy-Item -LiteralPath $exe -Destination (Join-Path $outDir 'BaileysBackup.exe') -Force

          $msiHash = (Get-FileHash -LiteralPath $msiOut -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeHash = (Get-FileHash -LiteralPath (Join-Path $outDir 'BaileysBackup.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$msiHash  $msiName",
            "$exeHash  BaileysBackup.exe"
          ) | Set-Content -Path (Join-Path $outDir 'SHA256SUMS.txt') -Encoding Ascii

          $msiSizeKb = [Math]::Round((Get-Item -LiteralPath $msiOut).Length / 1024.0, 1)
          $exeSizeKb = [Math]::Round((Get-Item -LiteralPath (Join-Path $outDir 'BaileysBackup.exe')).Length / 1024.0, 1)
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "msi_name=$msiName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "msi_size_kb=$msiSizeKb" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "exe_size_kb=$exeSizeKb" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify MSI metadata and auto-close action
        shell: powershell
        env:
          MSI_NAME: ${{ steps.package.outputs.msi_name }}
          APP_VERSION: ${{ steps.package.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $msiPath = Join-Path $PWD ("release-out\" + $env:MSI_NAME)
          if (-not (Test-Path -LiteralPath $msiPath -PathType Leaf)) {
            throw "File MSI tidak ditemukan: $msiPath"
          }

          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $installer, @($msiPath, 0))

          function Query-Single([string]$sql) {
            $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @($sql))
            $null = $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)
            $rec = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
            if ($null -eq $rec) {
              $null = $view.GetType().InvokeMember('Close', 'InvokeMethod', $null, $view, $null)
              return $null
            }
            $val = $rec.GetType().InvokeMember('StringData', 'GetProperty', $null, $rec, @(1))
            $null = $view.GetType().InvokeMember('Close', 'InvokeMethod', $null, $view, $null)
            return $val
          }

          $prodName = Query-Single "SELECT Value FROM Property WHERE Property='ProductName'"
          $prodVer = Query-Single "SELECT Value FROM Property WHERE Property='ProductVersion'"
          Write-Host "MSI ProductName=$prodName | ProductVersion=$prodVer"
          if ($prodName -ne 'Baileys Backup') { throw "MSI ProductName tidak sesuai: '$prodName'" }
          if ($prodVer -ne "$($env:APP_VERSION).0") { throw "MSI ProductVersion tidak sesuai: '$prodVer'" }

          $closeTable = Query-Single "SELECT Name FROM _Tables WHERE Name='Wix4CloseApplication'"
          if (-not $closeTable) {
            $closeTable = Query-Single "SELECT Name FROM _Tables WHERE Name='WixCloseApplication'"
          }
          if (-not $closeTable) {
            throw "Tabel CloseApplication (Wix4CloseApplication/WixCloseApplication) tidak ditemukan di MSI"
          }
          $closeTarget = Query-Single "SELECT Target FROM $closeTable WHERE Target='BaileysBackup.exe'"
          Write-Host "MSI CloseApplication table=$closeTable | Target=$closeTarget"
          if ($closeTarget -ne 'BaileysBackup.exe') {
            throw "Baris CloseApplication untuk BaileysBackup.exe tidak ditemukan"
          }

      - name: Upload GitHub Actions build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaileysBackup-windows-x64
          path: |
            release-out/BaileysBackup-setup-v*.msi
            release-out/BaileysBackup.exe
            release-out/SHA256SUMS.txt
          retention-days: 30

      - name: Publish or update GitHub Release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          MSI_NAME: ${{ steps.package.outputs.msi_name }}
          MSI_SIZE_KB: ${{ steps.package.outputs.msi_size_kb }}
          EXE_SIZE_KB: ${{ steps.package.outputs.exe_size_kb }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ('${{ github.ref_type }}' -eq 'tag') {
            '${{ github.ref_name }}'
          } elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_RELEASE_TAG)) {
            $env:INPUT_RELEASE_TAG.Trim()
          } else {
            'baileys-backup-latest'
          }

          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $msiName = $env:MSI_NAME
          $notes = @(
            "Build otomatis GitHub Actions untuk **Baileys Backup (Windows x64)** dari commit ``$shortSha``.",
            "",
            "### Unduhan Installer",
            "- ``$msiName`` ($($env:MSI_SIZE_KB) KB, direkomendasikan): installer Windows ``.msi`` yang otomatis menghentikan ``BaileysBackup.exe`` yang sedang berjalan, memasang versi baru ke ``%LOCALAPPDATA%\Programs\BaileysBackup\``, mendaftarkan Auto-Start & Start Menu, lalu menyalakan aplikasi saat Finish.",
            "- ``BaileysBackup.exe`` ($($env:EXE_SIZE_KB) KB): binary standalone.",
            "- ``SHA256SUMS.txt``: checksum SHA-256 untuk verifikasi integritas berkas."
          ) -join "`n"

          $notesFile = Join-Path $env:RUNNER_TEMP 'baileys-release-notes.md'
          Set-Content -Path $notesFile -Value $notes -Encoding utf8

          if ($tag -eq 'baileys-backup-latest') {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f $tag $env:GITHUB_SHA
            git push origin "refs/tags/$tag" --force
          }

          $exists = $false
          & gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            $exists = $true
          }

          $assets = @(
            "release-out/$msiName",
            'release-out/BaileysBackup.exe',
            'release-out/SHA256SUMS.txt'
          )

          if ($exists) {
            & gh release edit $tag --target $env:GITHUB_SHA --title "Baileys Backup (Windows x64)" --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { throw "gh release edit gagal" }
            & gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload gagal" }
            & gh release delete-asset $tag 'BaileysBackup-windows-x64.zip' --yes *> $null
          } else {
            & gh release create $tag @assets --target $env:GITHUB_SHA --title "Baileys Backup (Windows x64)" --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { throw "gh release create gagal" }
          }
