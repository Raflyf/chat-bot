name: Test Otomatis

# KENAPA: 36 test sudah dibuat (tests/), tetapi TIDAK ada yang menjalankannya
# otomatis. Akibatnya regresi bisa lolos ke produksi tanpa terdeteksi.
# Workflow ini menjalankan typecheck + test tiap push/PR ke main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  uji:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          # DISAMAKAN dengan package.json "engines.node": "22.x".
          # Sebelumnya '20' -> beberapa API Node 22 tidak tersedia sehingga
          # test gagal di CI walau lulus di lokal.
          node-version: '22'
          cache: 'npm'

      - name: Pasang dependensi
        run: npm ci || npm install

      - name: Typecheck (TypeScript)
        run: npm run typecheck

      - name: Jalankan test
        # Hanya test MURNI (tanpa DB). tests/integrasi.test.mjs dikecualikan
        # karena memerlukan kredensial Supabase yang tidak ada di CI (test itu
        # sudah otomatis SKIP bila DB tidak tersedia, tetapi kita kecualikan
        # agar durasi CI stabil).
        run: npx tsx --test tests/waktu.test.mjs tests/pengingat.test.mjs tests/game.test.mjs tests/berulang.test.mjs tests/rate-limit.test.mjs tests/neuron.test.mjs tests/usage-groq.test.mjs tests/format-angka.test.mjs tests/keamanan.test.mjs tests/lokasi-tertunda.test.mjs tests/presisi-waktu.test.mjs tests/zona-parse.test.mjs tests/nomor-tugas.test.mjs tests/selesai-nama.test.mjs tests/sesi-upgrade.test.mjs
        env:
          NODE_ENV: 'test'
          # Test murni tidak butuh DB; nilai dummy agar modul yang membaca env
          # saat impor tidak gagal.
          SUPABASE_URL: 'https://contoh.supabase.co'
          SUPABASE_SERVICE_KEY: 'dummy-untuk-test'
